<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gran Sorteo El Prestigio</title>

    <link rel="shrotcut icon" href="{{ url_for("static",filename="favicon.jpg") }}" type="image/x-icon">
    
    <style>
      body {
        background: radial-gradient(circle, #2c2c2c 0%, #000 100%);
        color: #d4af37;
        font-family: "Arial Black", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }

      .contenedor {
        text-align: center;
        background: rgba(0, 0, 0, 0.85);
        padding: 40px;
        border: 3px solid #d4af37;
        border-radius: 30px;
        box-shadow: 0 0 30px #d4af37;
        width: 80%;
        max-width: 600px;
      }

      .marco-foto {
        width: 250px;
        height: 250px;
        margin: 20px auto;
        border: 5px solid #d4af37;
        border-radius: 15px;
        overflow: hidden;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #foto-ganador {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .nombre-display {
        font-size: 2.5rem;
        margin: 20px 0;
        min-height: 60px;
        text-transform: uppercase;
      }

      .botones {
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      button {
        background: linear-gradient(45deg, #d4af37, #b8860b);
        color: black;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        border-radius: 10px;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px #fff;
      }

      .animar {
        animation: suspenso 0.1s infinite;
      }
      @keyframes suspenso {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.02);
          opacity: 0.7;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h1>EL PRESTIGIO DE PASOANCHO</h1>
      <div class="marco-foto">
        <img id="foto-ganador" src="" alt="Ganador" />
        <div id="placeholder" style="font-size: 5rem">?</div>
      </div>

      <div id="nombre-ganador" class="nombre-display">¡LISTOS PARA GANAR!</div>

      <div class="botones">
        <button onclick="iniciarSorteo('general')">SORTEO GENERAL</button>
        <button onclick="iniciarSorteo('elite')">SORTEO ÉLITE</button>
      </div>
    </div>

    <script>
      function iniciarSorteo(tipo) {
        const nombreDiv = document.getElementById("nombre-ganador");
        const fotoImg = document.getElementById("foto-ganador");
        const placeholder = document.getElementById("placeholder");

        // Efecto de inicio
        nombreDiv.classList.add("animar");
        nombreDiv.innerText = "SORTEANDO...";
        fotoImg.style.display = "none";
        placeholder.style.display = "block";

        fetch(`/sortear/${tipo}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.error) {
              alert(data.error);
              nombreDiv.classList.remove("animar");
              return;
            }

            // Suspenso de 2 segundos (como la moneda)
            setTimeout(() => {
              nombreDiv.classList.remove("animar");
              nombreDiv.innerText = data.ganador;

              // Mostramos la foto
              fotoImg.src = `/static/fotos/${data.foto}`;
              fotoImg.style.display = "block";
              placeholder.style.display = "none";

              // Efecto final de victoria
              nombreDiv.style.color = "white";
              setTimeout(() => {
                nombreDiv.style.color = "#d4af37";
              }, 1000);
            }, 2000);
          });
      }
    </script>
  </body>
</html>
